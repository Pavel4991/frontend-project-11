<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend-project-11</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <script type="module" src="src/main.js" defer></script>
  </head>
  
  <body>
    <header class="container-fluid bg-dark p-5">
      <div class="row">
        <div class="col-md-10 col-lg-8 mx-auto text-white">
          <h1 class="display-3 mb-0">RSS агрегатор</h1>
          <p class="lead">Начните читать RSS сегодня! Это легко, это красиво.</p>
          <form action class="rss-form text-body">
              <div class="row">
                  <div class="col">
                      <div class="form-floating">
                          <input id="url-input" type="text" autofocus required name="url" aria-label="url" class="form-control w-100" placeholder="ссылка RSS" autocomplete="off">
                          <label for="url-input">Cсылка RSS</label>
                      </div>
                  </div>
                  <div class="col-auto">
                      <button type="submit" aria-label="add" class="btn btn-lg btn-primary px-sm-5 h-100">Добавить</button>
                  </div>
              </div>
          </form>
          <p class="mb-0 mt-2 text-secondary">Пример: https://lorem-rss.hexlet.app/feed</p>
          <p class="feedback position-absolute m-0 small text-danger"></p>
        </div>
      </div>
    </header>
    <main>
      <section class="container-fluid container-xxl p-5">
        <div class="row">
          <div id="posts" class="col-md-10 col-lg-8 order-1 mx-auto"></div>
          <div id="feeds" class="col-md-10 col-lg-4 order-0 order-lg-1 mx-auto"></div>
        </div>
      </section>
    </main>

    <footer class="text-center text-dark p-3 fixed-bottom border-top bg-light">
      <span>created by <a href="https://ru.hexlet.io/">Hexlet</a></span>
    </footer>

    <div id="modal" class="modal" tabindex="-1" aria-labelledby="modalLabel">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalLabel">Modal title</h5>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">Цель: Научиться извлекать из дерева необходимые данные</div>
          <div class="modal-footer">
            <a id="modal-details-btn" class="btn btn-primary" href="#" target="_blank" type="button">Modal link button</a>
            <button id="modal-close-btn" class="btn btn-secondary" type="button" data-bs-dismiss="modal"></button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
