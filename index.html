<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend-project-11</title>
    <link rel="stylesheet" href="src/styles/bootstrap.min .css">
  </head>
  <body>
    <header class="container-fluid bg-dark p-5">
      <div class="row">
        <div class="col-md-10 col-lg-8 mx-auto text-white">
          <h1 class="display-3 mb-0">RSS агрегатор</h1>
          <p class="lead">Начните читать RSS сегодня! Это легко, это красиво.</p>
          <form action class="rss-form text-body">
              <div class="row">
                  <div class="col">
                      <div class="form-floating">
                          <input id="url-input" type="text" autofocus required name="url" aria-label="url" class="form-control w-100" placeholder="ссылка RSS" autocomplete="off">
                          <label for="url-input">ссылка RSS</label>
                      </div>
                  </div>
                  <div class="col-auto">
                      <button type="submit" aria-label="add" class="btn btn-lg btn-primary px-sm-5 h-100">Добавить</button>
                  </div>
              </div>
          </form>
          <p class="mb-0 mt-2 text-secondary">Пример: https://lorem-rss.hexlet.app/feed</p>
          <p class="feedback position-absolute m-0 small text-danger"></p>
        </div>
      </div>
    </header>
  </body>
</html>
