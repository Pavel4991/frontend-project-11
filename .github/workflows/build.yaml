name: build

on: 
  - push
  - pull_request

env:
  CI: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps: 
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: make install
      - run: make lint
      - name: SonarQube Scan
        uses: e694c46a8d817fcfe9b3d2a449947c502655516e
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
